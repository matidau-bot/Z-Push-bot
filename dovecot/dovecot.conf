protocols = imap
listen = 127.0.0.1
base_dir = /run/zpdc
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
log_path = /run/zpdc.log
mail_location = maildir:/srv/zpmail/%u/Maildir:LAYOUT=fs
mail_uid = zptest
mail_gid = zptest
first_valid_uid = 1
passdb {
  driver = static
  args = password=secret
}
userdb {
  driver = static
  args = uid=zptest gid=zptest home=/srv/zpmail/%u
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
}
service imap-login {
  inet_listener imap {
    port = 10143
  }
}
